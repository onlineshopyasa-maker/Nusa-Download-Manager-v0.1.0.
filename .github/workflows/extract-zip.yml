name: Nusa Download Manager - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            mkdir -p _nusa_extract
            unzip -oq NusaDownloadManager-starter.zip -d _nusa_extract
            cp -a _nusa_extract/. .
            rm -rf _nusa_extract
          else
            echo "Source code sudah tersedia."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Prepare Nusa Download Manager source"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaDownloadManager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
